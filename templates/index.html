<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tracelet – Indoor Navigation</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    h2, h3 {
      margin-bottom: 8px;
    }

    .controls {
      margin-bottom: 12px;
    }

    input, select, button {
      padding: 8px;
      margin: 6px 6px 6px 0;
      font-size: 14px;
    }

    button {
      background: #0b66c3;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }

    #mapCanvas {
      border: 2px solid #333;
      display: none;
      max-width: 95%;
      margin-top: 12px;
    }

    #status {
      margin-top: 8px;
      color: #444;
    }

    #pathOutput {
      margin-top: 10px;
      font-weight: bold;
      color: #222;
    }
  </style>
</head>

<body>

<h2>Tracelet – Indoor Navigation</h2>

<div class="controls">
  <label><b>Select Map:</b></label>
  <select id="mapSelect">
    <option value="Saveetha Engineering College">
      Saveetha Engineering College
    </option>
    {% for m in uploaded_maps %}
      <option value="{{ m.map_name }}">{{ m.map_name }}</option>
    {% endfor %}
  </select>

  <br>

  <input type="text" id="startInput" placeholder="Start Room">
  <input type="text" id="goalInput" placeholder="Destination Room">
  <button id="findPathBtn">Find Path</button>

  <div id="status">
    Enter start and destination rooms for Saveetha Engineering College.
  </div>

  <div id="pathOutput"></div>
</div>

<canvas id="mapCanvas"></canvas>

<hr>

<h3>Upload Indoor Map (Image-based)</h3>
<form id="uploadForm" enctype="multipart/form-data">
  <input type="text" name="map_name" placeholder="Map name (optional)">
  <input type="file" name="file" accept=".jpg,.jpeg,.png,.webp" required>
  <button type="submit">Upload</button>
</form>

<script>
/* ---------------- ELEMENTS ---------------- */
const mapSelect   = document.getElementById("mapSelect");
const startInput  = document.getElementById("startInput");
const goalInput   = document.getElementById("goalInput");
const findPathBtn = document.getElementById("findPathBtn");
const canvas      = document.getElementById("mapCanvas");
const ctx         = canvas.getContext("2d");
const status      = document.getElementById("status");
const pathOutput  = document.getElementById("pathOutput");
const uploadForm  = document.getElementById("uploadForm");

/* ---------------- STATE ---------------- */
let img = new Image();
let startPt = null;
let goalPt = null;

/* ---------------- HELPERS ---------------- */
function isSaveetha() {
  return mapSelect.value === "Saveetha Engineering College";
}

function resetInputs() {
  startInput.value = "";
  goalInput.value = "";
  startPt = null;
  goalPt = null;
  pathOutput.textContent = "";
}

function drawBaseImage(image) {
  canvas.width = image.naturalWidth;
  canvas.height = image.naturalHeight;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(image, 0, 0);
}

function drawMarkers() {
  if (startPt) {
    ctx.beginPath();
    ctx.fillStyle = "green";
    ctx.arc(startPt.x, startPt.y, 6, 0, Math.PI * 2);
    ctx.fill();
  }
  if (goalPt) {
    ctx.beginPath();
    ctx.fillStyle = "red";
    ctx.arc(goalPt.x, goalPt.y, 6, 0, Math.PI * 2);
    ctx.fill();
  }
}

function getCanvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: Math.round((e.clientX - rect.left) * (canvas.width / rect.width)),
    y: Math.round((e.clientY - rect.top) * (canvas.height / rect.height))
  };
}

/* ---------------- MAP CHANGE ---------------- */
mapSelect.addEventListener("change", () => {
  resetInputs();

  if (isSaveetha()) {
    canvas.style.display = "none";
    startInput.placeholder = "Start Room (e.g. CSE101)";
    goalInput.placeholder  = "Destination Room (e.g. Library)";
    status.textContent =
      "Enter start and destination rooms for Saveetha Engineering College.";
  } else {
    canvas.style.display = "block";
    startInput.placeholder = "Start (x,y)";
    goalInput.placeholder  = "Goal (x,y)";
    status.textContent =
      "Click on the map to select start and goal points.";

    img = new Image();
    img.onload = () => drawBaseImage(img);
    img.src = "/map-image/" + encodeURIComponent(mapSelect.value);
  }
});

/* ---------------- CANVAS CLICK ---------------- */
canvas.addEventListener("click", (e) => {
  const pt = getCanvasCoords(e);

  if (!startPt) {
    startPt = pt;
    startInput.value = `${pt.x},${pt.y}`;
  } else if (!goalPt) {
    goalPt = pt;
    goalInput.value = `${pt.x},${pt.y}`;
  } else {
    startPt = pt;
    goalPt = null;
    startInput.value = `${pt.x},${pt.y}`;
    goalInput.value = "";
  }

  drawBaseImage(img);
  drawMarkers();
});

/* ---------------- FIND PATH ---------------- */
findPathBtn.addEventListener("click", async () => {

  /* ---- SAVEETHA ROOM-BASED ---- */
  if (isSaveetha()) {
    if (!startInput.value || !goalInput.value) {
      alert("Please enter both room names.");
      return;
    }

    status.textContent = "Finding path...";
    const url =
      `/saveetha-path?start_room=${encodeURIComponent(startInput.value)}` +
      `&end_room=${encodeURIComponent(goalInput.value)}`;

    const resp = await fetch(url);
    const data = await resp.json();

    if (!resp.ok) {
      alert(data.detail || "Path not found");
      status.textContent = "Error finding path.";
      return;
    }

    pathOutput.textContent = "Path: " + data.path.join(" → ");
    status.textContent = "Path found successfully.";
    return;
  }

  /* ---- IMAGE-BASED ---- */
  if (!startPt || !goalPt) {
    alert("Click on map to set start and goal.");
    return;
  }

  status.textContent = "Computing path...";
  const url =
    `/indoor-path?map_name=${encodeURIComponent(mapSelect.value)}` +
    `&sx=${startPt.x}&sy=${startPt.y}` +
    `&gx=${goalPt.x}&gy=${goalPt.y}`;

  const resp = await fetch(url);
  const blob = await resp.blob();

  const resultImg = new Image();
  resultImg.onload = () => {
    drawBaseImage(resultImg);
    status.textContent = "Path drawn successfully.";
  };
  resultImg.src = URL.createObjectURL(blob);
});

/* ---------------- UPLOAD ---------------- */
uploadForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const formData = new FormData(uploadForm);

  const res = await fetch("/upload-map", {
    method: "POST",
    body: formData
  });

  const data = await res.json();
  alert(data.message || "Uploaded");
  window.location.reload();
});

/* ---------------- INITIAL STATE ---------------- */
mapSelect.dispatchEvent(new Event("change"));
</script>

</body>
</html>
