<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracelets - Pin. Trace. Navigate.</title>
    <style>
        /* --- CSS STYLES --- */
        /* Architectural Scale Border — Refined */
.scale-border {
    position: fixed;
    top: 0.4in;
    left: 0.4in;
    right: 0.4in;
    bottom: 0.4in;
    pointer-events: none;
    z-index: 10;

    /* Clean border frame */
    border: 2px solid rgba(255, 255, 255, 0.9);

    /* Scale ticks ONLY on top and left */
    background:
        /* Top scale */
        repeating-linear-gradient(
            to right,
            rgba(255,255,255,0.85) 0,
            rgba(255,255,255,0.85) 2px,
            transparent 2px,
            transparent 18px
        ),
        /* Left scale */
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.85) 0,
            rgba(255,255,255,0.85) 2px,
            transparent 2px,
            transparent 18px
        );

    background-position:
        top left,
        top left;

    background-size:
        100% 10px,   /* top ruler height */
        10px 100%;   /* left ruler width */

    background-repeat: no-repeat;
}


        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents scrollbars */
            font-family: 'Courier New', Courier, monospace; /* Tech/Drafting font */
        }

        /* The Blueprint Background Effect */
        .blueprint-bg {
            background-color: #0033cc; /* Strong Engineering Blue */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.2) 1px, transparent 1px);
            background-size: 40px 40px; /* Size of the grid squares */
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px #001a66;
        }

        h3 {
            font-size: 1.5rem;
            margin-bottom: 60px;
            opacity: 0.9;
            font-weight: normal;
        }

        /* The Button Container */
        .button-group {
            display: flex;
            gap: 30px; /* Space between buttons */
        }

        /* The "Blueprint" Buttons */
        .blueprint-btn {
            background: transparent;
            border: 2px solid white;
            color: white;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            font-family: 'Courier New', Courier, monospace;
        }

        .blueprint-btn:hover {
            background: white;
            color: #0033cc;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            transform: translateY(-2px);
        }

        /* Footer */
        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.8rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="scale-border"></div>

    <div class="blueprint-bg">
        <h1>Tracelets</h1>
        <h3>Tracing from Maps & Blueprints.<br>Pin. Trace. Navigate.</h3>

        <div class="button-group">
            <a href="/login-user" class="blueprint-btn">
                ➔ Login as User
            </a>

            <a href="/login-admin" class="blueprint-btn">
                ➔ Login as Admin
            </a>
        </div>

        <div class="footer">
            Saveetha Engineering College • Mini Project
        </div>
    </div>

</body>
</html>
