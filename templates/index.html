<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracelets - Pin. Trace. Navigate.</title>
    <style>
        /* --- CSS STYLES --- */
        /* Architectural Scale Border — Refined */
        .scale-border {
            position: fixed; top: 0.4in; left: 0.4in; right: 0.4in; bottom: 0.4in; pointer-events: none; z-index: 10;
            border: 2px solid rgba(255, 255, 255, 0.9);
            background: repeating-linear-gradient(to right, rgba(255,255,255,0.85) 0, rgba(255,255,255,0.85) 2px, transparent 2px, transparent 18px),
                        repeating-linear-gradient(to bottom, rgba(255,255,255,0.85) 0, rgba(255,255,255,0.85) 2px, transparent 2px, transparent 18px);
            background-position: top left, top left;
            background-size: 100% 10px, 10px 100%;
            background-repeat: no-repeat;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: 'Courier New', Courier, monospace;
        }

        /* The Blueprint Background Effect */
        .blueprint-bg {
            background-color: #0033cc; /* Strong Engineering Blue */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.2) 1px, transparent 1px);
            background-size: 40px 40px;
            width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; text-align: center;
        }

        h1 { font-size: 4rem; margin-bottom: 10px; text-shadow: 2px 2px 0px #001a66; }
        h3 { font-size: 1.5rem; margin-bottom: 60px; opacity: 0.9; font-weight: normal; }

        /* The Button Container */
        .button-group { display: flex; gap: 30px; margin-bottom: 30px; }

        /* The "Blueprint" Buttons */
        .blueprint-btn {
            background: transparent; border: 2px solid white; color: white;
            padding: 15px 30px; font-size: 1.1rem; font-weight: bold; cursor: pointer;
            transition: all 0.2s ease; text-decoration: none;
            font-family: 'Courier New', Courier, monospace;
        }
        
        .blueprint-btn:hover {
            background: white; 
            color: #0033cc;
            /* Removed the glow (box-shadow) for a cleaner look */
            transform: translateY(-2px);
        }

        /* Guest Upload Form (Hidden by default) */
        #guest-upload {
            display: none;
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            border: 1px dashed white;
            backdrop-filter: blur(5px);
            margin-top: 10px;
            border-radius: 4px;
        }

        /* Footer */
        .footer { position: absolute; bottom: 20px; font-size: 0.8rem; opacity: 0.7; }
    </style>
</head>
<body>

    <div class="scale-border"></div>

    <div class="blueprint-bg">
        <h1>Tracelets</h1>
        <h3>Tracing from Maps & Blueprints.<br>Pin. Trace. Navigate.</h3>

        <div class="button-group">
            <a href="/login-user" class="blueprint-btn">
                ➔ Login as User
            </a>

            <a href="/login-admin" class="blueprint-btn">
                ➔ Login as Admin
            </a>

            <button onclick="showGuestUpload()" class="blueprint-btn">
                ➔ Try Tool
            </button>
        </div>

        <div id="guest-upload">
            <p style="margin-top:0; font-weight:bold; margin-bottom:10px;">Upload a floor plan to test:</p>
            <form action="/upload-map" method="post" enctype="multipart/form-data">
                <input type="file" name="file" required style="color:white; font-family: monospace;">
                <button type="submit" style="cursor:pointer; padding:5px 15px; font-weight:bold; background:white; color:#0033cc; border:none; font-family: 'Courier New', Courier, monospace;">GO</button>
            </form>
        </div>

        <div class="footer">
            Saveetha Engineering College • Mini Project
        </div>
    </div>

    <script>
        function showGuestUpload() {
            const form = document.getElementById('guest-upload');
            // Toggle visibility
            if (form.style.display === 'block') {
                form.style.display = 'none';
            } else {
                form.style.display = 'block';
            }
        }
    </script>

</body>
</html>
