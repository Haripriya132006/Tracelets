<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login - Tracelets</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Exact same style as signup for consistency */
        body {
            margin: 0; padding: 0; width: 100%; min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background-color: #0033cc;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.2) 1px, transparent 1px);
            background-size: 40px 40px;
            display: flex; justify-content: center; align-items: center;
        }

        .login-card {
            background: #ffffff;
            width: 400px; /* Much smaller than the registration form */
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border-radius: 4px;
            text-align: center;
        }

        h2 { color: #0033cc; margin-top: 0; text-transform: uppercase; font-size: 1.5rem; }
        p { color: #666; font-size: 0.9rem; margin-bottom: 30px; }

        input {
            width: 100%; padding: 12px; margin-bottom: 15px;
            border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        .btn-login {
            width: 100%; padding: 12px; background: #0033cc; color: white;
            border: none; font-weight: bold; cursor: pointer; text-transform: uppercase;
        }
        .btn-login:hover { background: #002288; }

        .back-link { display: block; margin-top: 20px; font-size: 0.85rem; color: #999; text-decoration: none; }
        .back-link:hover { color: #333; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Admin Portal</h2>
        <p>Please enter your credentials to access the facility dashboard.</p>

        <form action="/auth-admin" method="post">
            <input type="email" name="email" placeholder="Work Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn-login">Login</button>
        </form>

        <a href="/signup-admin" style="display:block; margin-top:15px; font-size:0.9rem; color:#0033cc; text-decoration:none;">Register New Organization</a>
        <a href="/" class="back-link">← Back to Home</a>
    </div>

</body>
</html>
