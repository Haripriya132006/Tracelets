<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusRoute - List of Rooms</title>

  <link rel="stylesheet" href="/saveetha_files/style.css">

  <style>
    /* Page-specific styles */
    main {
      padding: 0px 40px 60px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      overflow: auto;
    }
    .page-title { font-size: 36px; font-weight: bold; text-align: center; margin-top: 0px; }
    .subtitle { text-align: center; font-size: 20px; color: #555; margin-bottom: 30px; }

    /* Search / filter */
    .search-container { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 600px; }
    .search-container input, .search-container select {
      font-family: 'Pixelinx', monospace; font-size: 18px; padding: 8px;
      border: 2px solid black; border-radius: 8px; outline: none; width: 100%;
    }

    /* Rooms grid */
    .rooms-grid {
      display: grid; grid-template-columns: repeat(3,1fr); gap: 20px;
      width: 100%; max-width: 1100px; padding: 0 20px;
    }
    .room-card {
      background: #f7f7f7; border: 3px solid black; border-radius: 16px;
      box-shadow: 2px 2px 0 #000; padding: 15px; text-align: center;
      cursor: pointer; transition: transform 0.2s;
    }
    .room-card:hover { transform: scale(1.03); }
    .room-name { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
    .room-info { font-size: 14px; color: #333; }

    /* Responsive */
    @media (max-width: 900px) { .rooms-grid { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 600px) { .rooms-grid { grid-template-columns: 1fr; } main { padding: 80px 20px 40px; } }
  </style>
</head>
<body>

  <img src="/saveetha_files/assets/compass.svg" alt="Compass Logo" class="corner-logo">

  <aside class="logo" onclick="window.location.href='/campus-route'">CampusRoute</aside>

  <main>
    <div class="page-title">List of Rooms</div>
    <div class="subtitle">Search, filter, and explore rooms across all floors</div>

    <div class="search-container">
      <input type="text" id="roomSearch" placeholder="Search room by name or number…">
      <select id="floorFilter">
        <option value="">All Floors</option>
        <option value="Ground">Ground Floor</option>
        <option value="1">1st Floor</option>
        <option value="2">2nd Floor</option>
        <option value="3">3rd Floor</option>
        <option value="4">4th Floor</option>
        <option value="5">5th Floor</option>
        <option value="6">6th Floor</option>
      </select>
      <select id="typeFilter">
        <option value="">All Types</option>
        <option value="Lab">Lab</option>
        <option value="Office">Office</option>
        <option value="Lecture Hall">Lecture Hall</option>
        <option value="Restroom">Restroom</option>
        <option value="Vending">Vending</option>
      </select>
    </div>

    <div class="rooms-grid">
      <div class="room-card" data-floor="Ground" data-type="Lab">
        <div class="room-name">CAD Lab</div>
        <div class="room-info">Ground Floor | Lab | Engineering Dept</div>
      </div>
      <div class="room-card" data-floor="1" data-type="Office">
        <div class="room-name">Admissions Office</div>
        <div class="room-info">1st Floor | Office</div>
      </div>
      <div class="room-card" data-floor="2" data-type="Lecture Hall">
        <div class="room-name">Room 203 - Lecture Hall</div>
        <div class="room-info">2nd Floor | Lecture Hall</div>
      </div>
      <div class="room-card" data-floor="3" data-type="Vending">
        <div class="room-name">Vending Area</div>
        <div class="room-info">3rd Floor | Vending Machines</div>
      </div>
    </div>

    <div id="themeToggle" class="theme-toggle">
        <img id="themeIcon" src="/saveetha_files/assets/sun-removebg-preview.png" alt="Dark mode toggle" />
    </div>

    <div id="hamburger" class="hamburger">&#9776;</div>
    <div id="sideMenu" class="side-menu hidden">
    <ul>
        <li><a href="/saveetha_files/explore.html">Explore Floors</a></li>
        <li><a href="/saveetha_files/rooms.html" class="active">List of Rooms</a></li>
        <li><a href="/campus-route">Home</a></li>
    </ul>
    </div>
    
    <div id="menuOverlay" class="menu-overlay hidden"></div>
    <div id="errorMsg" class="hidden"></div>
  </main>
  
  <script src="/saveetha_files/app.js"></script>
</body>
</html>
