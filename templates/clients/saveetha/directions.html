<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Route - CampusRoute</title>
  <link rel="stylesheet" href="/saveetha_files/style.css" />
  
  <style>
    /* Specific Styles for Directions Page */
    .split-layout {
        display: flex;
        width: 100%;
        max-width: 1200px;
        height: 80vh; /* Fixed height for dashboard feel */
        gap: 20px;
        margin-top: 20px;
    }

    /* Left Side: Checklist */
    .steps-container {
        flex: 1;
        background: #fff;
        border: 3px solid black;
        border-radius: 12px;
        padding: 20px;
        overflow-y: auto; /* Scrollable if long path */
        box-shadow: 4px 4px 0 rgba(0,0,0,0.1);
    }

    .route-summary {
        border-bottom: 2px dashed #ccc;
        padding-bottom: 15px;
        margin-bottom: 20px;
    }

    /* Checklist Items */
    .step-item {
        display: flex;
        align-items: center;
        margin-bottom: 15px;
        font-size: 1.1rem;
        padding: 10px;
        background: #f9f9f9;
        border-radius: 8px;
        transition: background 0.2s;
    }
    .step-item:hover { background: #f0f0f0; }

    .step-checkbox {
        width: 24px;
        height: 24px;
        margin-right: 15px;
        cursor: pointer;
        accent-color: black;
    }

    /* Floor Headers */
    .floor-header {
        background: black;
        color: white;
        padding: 8px 15px;
        border-radius: 6px;
        margin: 20px 0 10px 0;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* Right Side: Map Placeholder */
    .map-placeholder {
        flex: 1.5; /* Wider than list */
        background: #e0e0e0;
        border: 3px solid black;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: relative;
        background-image: repeating-linear-gradient(45deg, #e0e0e0 0, #e0e0e0 10px, #e8e8e8 10px, #e8e8e8 20px);
    }

    .placeholder-text {
        background: white;
        padding: 20px;
        border: 2px solid black;
        text-align: center;
        box-shadow: 4px 4px 0 black;
    }

    /* Dark Mode Adjustments */
    body.dark-theme .steps-container { background: #111; border-color: white; color: white; }
    body.dark-theme .step-item { background: #222; }
    body.dark-theme .floor-header { background: white; color: black; }
    body.dark-theme .map-placeholder { border-color: white; background: #222; }
    body.dark-theme .placeholder-text { background: #111; border-color: white; color: white; box-shadow: 4px 4px 0 white; }

    @media (max-width: 800px) {
        .split-layout { flex-direction: column; height: auto; }
        .map-placeholder { height: 300px; }
    }
  </style>
</head>

<body>
  
  <img src="/saveetha_files/assets/compass.svg" alt="Compass Logo" class="corner-logo" />
  
  <aside class="logo" onclick="window.location.href='/campus-route'">Back</aside>

  <main>
    <div class="split-layout">
        
        <div class="steps-container">
            <div class="route-summary">
                <h2 style="margin-top:0;">Journey Plan</h2>
                <p><strong>From:</strong> {{ start }}</p>
                <p><strong>To:</strong> {{ end }}</p>
                <p><strong>Distance:</strong> ~{{ distance }} meters</p>
            </div>

            <form id="checklistForm">
                {% for item in steps %}
                    {% if item.type == 'header' %}
                        <div class="floor-header">{{ item.text }}</div>
                    {% else %}
                        <div class="step-item">
                            <input type="checkbox" class="step-checkbox" id="node-{{ item.node }}" onchange="updateMapState(this)">
                            <label for="node-{{ item.node }}">Go to <strong>{{ item.node }}</strong></label>
                        </div>
                    {% endif %}
                {% endfor %}
                
                <div class="step-item" style="background:#d4edda; border: 2px solid #c3e6cb; margin-top:20px;">
                    <input type="checkbox" class="step-checkbox" id="finish">
                    <label for="finish"><strong>You have reached your destination!</strong></label>
                </div>
            </form>
        </div>

        <div class="map-placeholder" id="mapView">
            <div class="placeholder-text">
                <h3>Interactive Map</h3>
                <p>Path visualization loading...</p>
                <p style="font-size:0.8em; color:#666;">(Map Module Unavailable in Pilot Version)</p>
            </div>
        </div>

    </div>
  </main>

  <script>
      function updateMapState(checkbox) {
          const mapText = document.querySelector('.placeholder-text p');
          if(checkbox.checked) {
              // Simulating map updating
              checkbox.parentElement.style.opacity = "0.5";
              checkbox.parentElement.style.textDecoration = "line-through";
              
              // Future Logic: If '24' (stairs) is checked, switch map image
              if(checkbox.id.includes('24') || checkbox.id.includes('Lift')) {
                  mapText.innerText = "Switching to Floor 1 Map...";
              }
          } else {
              checkbox.parentElement.style.opacity = "1";
              checkbox.parentElement.style.textDecoration = "none";
          }
      }
  </script>

</body>
</html>
