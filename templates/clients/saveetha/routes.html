<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CampusRoute</title>
  
  <link rel="stylesheet" href="/saveetha_files/style.css" />
  
  <style>
    @font-face {
      font-family: 'PixelFont';
      /* UPDATED PATH */
      src: url('/saveetha_files/assets/pixel-font.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
  </style>
  
</head>

<body>
  
  <img src="/saveetha_files/assets/compass.svg" alt="Compass Logo" class="corner-logo" />

  <aside class="logo">
    CampusRoute
  </aside>

  <main>
    <h1 class="slogan">Lost on campus? Don’t worry.<br><br/>Your <strong>campus GPS</strong> — just tell me where you are & where you’re headed.<br></h1>

    <form action="/saveetha/directions" method="get">
    <label for="startRoom">Where are you now?</label>
    <input type="text" id="startRoom" name="startRoom" required placeholder="e.g., 2611 or Library" />
      
    <label for="endRoom">Where do you want to go?</label>
    <input type="text" id="endRoom" name="endRoom" required placeholder="e.g., 4321 or CAD Lab" />
      
    <button type="submit">Show Me the Way →</button>
</form>

    <h4 class="contact-note">
    Having an issue? <a href="/saveetha_files/contact.html">Contact us</a>
    </h4>

    <div id="themeToggle" class="theme-toggle">
        <img id="themeIcon" src="/saveetha_files/assets/sun-removebg-preview.png" alt="Dark mode toggle" />
    </div>

    <div id="hamburger" class="hamburger">&#9776;</div>
    <div id="sideMenu" class="side-menu hidden">
    <ul>
        <li><a href="/saveetha_files/explore.html">Explore Floors</a></li>
        <li><a href="/saveetha_files/rooms.html">List of Rooms</a></li>
        <li>
            <a href="/dashboard-user?email={{ user_email }}">Back to Dashboard</a>
        </li>
    </ul>
    </div>
    
    <div id="menuOverlay" class="menu-overlay hidden"></div>
    <div id="errorMsg" class="hidden"></div>
  </main>

  <script src="/saveetha_files/app.js"></script>
</body>

</html>
