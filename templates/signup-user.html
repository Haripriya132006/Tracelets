<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Tracelets</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0033cc;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.2) 1px, transparent 1px);
            background-size: 40px 40px;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 40px;
            width: 320px;
            border-radius: 8px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            color: white;
            text-align: center;
        }
        h2 { margin-top: 0; margin-bottom: 20px; font-weight: 500; }
        input {
            width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 4px;
            background: rgba(0, 0, 0, 0.2); color: white; outline: none; font-size: 14px;
        }
        input::placeholder { color: rgba(255, 255, 255, 0.7); }
        input:focus { background: rgba(0, 0, 0, 0.4); border-color: white; }
        .btn-login {
            width: 100%; padding: 12px; margin-top: 20px;
            background-color: white; color: #0033cc; border: none;
            border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px;
        }
        .btn-login:hover { background-color: #f0f0f0; }
        .links { margin-top: 20px; font-size: 12px; }
        .links a { color: #ffcc00; text-decoration: none; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Create Account</h2>
        
        <form action="/register" method="post">
            <input type="text" name="username" placeholder="Full Name" required>
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="password" name="password" placeholder="Password" required>
            
            <button type="submit" class="btn-login">Sign Up</button>
        </form>

        <div class="links">
            Already have an account? <a href="/login-user">Login here</a>
        </div>
    </div>

</body>
</html>
